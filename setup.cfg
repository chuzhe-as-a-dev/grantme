[metadata]
name = grantme
version = 0.0.3
author = Chuzhe Tang
author_email = t.chuzhe@qq.com
description = A noncompulsory CLI access management tool for shared machines
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/chuzhe-as-a-dev/grantme
project_urls =
    Bug Tracker = https://github.com/chuzhe-as-a-dev/grantme/issues
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Topic :: System :: Systems Administration
    Topic :: Utilities
    License :: OSI Approved :: MIT License
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
license = MIT

[options]
package_dir =
    grantme = grantme
    utils = grantme/utils
packages = find:
python_requires = >=3.6

[options.entry_points]
console_scripts =
    grantme = grantme.main:main

[options.packages.find]
where = .
